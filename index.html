 firebase.auth().signInAnonymously().then(async ({user})=>{
   hostUid=user.uid;

   playersRef=roomRef.child('players');
   const owner=roomRef.child('owner');
   const snap=await owner.once('value');
   if(!snap.exists())await owner.set(hostUid);
